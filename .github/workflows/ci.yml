# Intégration continue — dépôt public de démonstration.
#
# Un seul travail, dans l'ordre exact de `npm run check`, plus deux contrôles
# que la machine de développement ne peut pas faire seule : gitleaks, et la
# fraîcheur des données générées.
#
# Pourquoi un seul travail et non trois en parallèle : les trois travaux
# précédents réinstallaient chacun les dépendances. Trois `npm ci` pour un
# projet de cette taille coûtent plus de temps que la parallélisation n'en
# fait gagner, et diluent la lecture du journal quand quelque chose casse.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push qui suit de près un autre annule la vérification devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Vérification complète
    # Lot D (Q4) — image épinglée : `ubuntu-latest` passe à Ubuntu 26 le
    # 19/10/2026. Le changement d'image se fera exprès, pas par surprise.
    runs-on: ubuntu-24.04

    env:
      # Sans cette variable, l'absence de gitleaks ne serait qu'un
      # avertissement — acceptable sur un poste de travail, pas ici.
      GITLEAKS_REQUIS: "1"
      GITLEAKS_VERSION: "8.24.3"
      # DM-01 (A2) — empreinte SHA-256 de l'archive linux_x64 de cette
      # version, relevée le 07/11/2026 dans gitleaks_8.24.3_checksums.txt et
      # recalculée sur l'archive téléchargée. Changer de version = changer
      # aussi cette ligne.
      GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
      # DM-01 (A1) — le secret LISTE_NOIRE n'est PLUS donné à tout le
      # travail. Seules les deux étapes qui le lisent le reçoivent : Tests et
      # Contrôle de publication. npm ci, lint, build et les autres outils
      # tournent sans lui.

    steps:
      # v5 et non v4 : les briques v4 tournent sur un Node que GitHub
      # déprécie, et il le signale à chaque exécution. v5 est la première
      # version qui corrige ce point — v7 existe, mais rien ici n'a besoin
      # de ce qu'elle apporte.
      #
      # DM-01 (A2) — briques épinglées par empreinte de commit, pas par
      # étiquette : une étiquette peut être déplacée, une empreinte non.
      # La version lisible est en commentaire, en fin de ligne.
      - name: Récupération du dépôt
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # DM-01 (A1) — le jeton GitHub n'est pas laissé dans .git/config,
          # où n'importe quel outil lancé ensuite pourrait le lire.
          persist-credentials: false

      # Node 22 : c'est le plancher déclaré dans `engines`. La CI doit
      # éprouver la version la plus basse qu'on prétend supporter, pas la
      # plus confortable. Lot D (Q4) : Node 20 est en fin de vie depuis
      # avril 2026 ; le plancher monte à 22 (LTS).
      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # DM-01 (A1) — aucun script d'installation des paquets ne s'exécute.
      # Mesuré le 07/11/2026 : seul fsevents (macOS, facultatif) en a un,
      # et il ne s'installe pas sous Linux. Un paquet piraté ne peut donc
      # rien lancer à l'installation.
      - name: Installation reproductible
        run: npm ci --ignore-scripts

      - name: Installation de gitleaks
        run: |
          set -euo pipefail
          # DM-01 — le 08/11/2026, GitHub a répondu « 504 » plusieurs fois :
          # on recevait une page d'erreur au lieu de l'archive, refusée par
          # le contrôle d'empreinte. -f : une erreur HTTP fait échouer curl ;
          # --retry : on réessaie avant d'abandonner.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Lot G — la liste des noms interdits ne vit pas dans le dépôt. Elle
      # arrive par un secret. Absente ou tronquée, tests et contrôle de
      # publication ÉCHOUENT : rien n'est sauté en silence.
      - name: Tests
        run: npm test
        env:
          LISTE_NOIRE: ${{ secrets.LISTE_NOIRE }}

      - name: Build
        run: npm run build

      # Les cinq fichiers de public/data/ sont produits par un générateur à
      # graine fixe. Les régénérer doit donc être sans effet. S'il y a une
      # différence, c'est que le générateur a été modifié sans être rejoué :
      # le dépôt publierait des données qui ne correspondent plus à leur
      # source.
      - name: Données générées à jour
        run: |
          npm run donnees
          if ! git diff --quiet -- public/data; then
            echo "::error::public/data/ ne correspond plus au générateur. Lancer 'npm run donnees' et committer le résultat."
            git --no-pager diff --stat -- public/data
            exit 1
          fi
          echo "public/data/ est à jour."

      # Dernier rempart avant publication : liste noire, liste blanche du
      # build, extensions interdites, gitleaks.
      - name: Contrôle de publication
        run: npm run verif
        env:
          LISTE_NOIRE: ${{ secrets.LISTE_NOIRE }}

      # Lot D — les deux contrôles de `npm run check` que la CI ne rejouait
      # pas : aucun libellé de la démonstration dans le code, et le classeur
      # modèle publié refait à l'identique par son script (un modèle retouché
      # à la main ne doit pas partir en ligne).
      - name: Vocabulaire
        run: npm run vocabulaire

      - name: Modèle refait à l'identique
        run: npm run modele
